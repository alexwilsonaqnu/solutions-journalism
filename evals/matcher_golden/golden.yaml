# Matcher golden set: reporter-style problem statements → the cards a good search must return in its top 5.
#
# status: proposed  — drafted by the build team; reported in CI, not gated
#         confirmed — checked by a Knight Lab editor; CI fails if recall@5 on confirmed pairs < threshold
#         rejected  — excluded
#
# Drafted 2026-11-03 against the first live library build (11 publishable cards). Expected values are card
# slugs; `solbrief golden-snapshot` freezes those cards (plus the rest of the publishable library as
# distractors) and the query embeddings into library.json. Local framings carry the reporter's county FIPS.
# The offline fixture set used by unit tests lives in tests/fixtures/matcher_golden.
version: 1
library_kind: live
threshold_confirmed_recall_at_5: null   # set from the first fitted baseline on confirmed pairs
